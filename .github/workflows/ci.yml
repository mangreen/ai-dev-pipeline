name: CI

# Quality gates for this repository (the toolkit itself). Not copied into product repositories.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install linters
        run: pip install --quiet yamllint==1.38.0 actionlint-py==1.7.12.25
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyyaml
      - run: make test
      - run: make docs-check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff scan (fast first line of defence)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/scripts/scan-secrets.sh --base "origin/$BASE_REF"
      # Second line of defence: scans the full history. Organisation-owned repositories need a
      # Gitleaks licence key in the GITLEAKS_LICENSE secret (see README, "Troubleshooting").
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
